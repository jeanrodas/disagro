# Cabeceras de seguridad de lo que sirve nginx directamente (HTML y estáticos).
#
# Se INCLUYE en cada location estático en vez de declararse una vez en el server,
# por dos motivos:
#   1. En nginx, un add_header dentro de un location anula TODOS los add_header
#      heredados del server. Declararlas aquí y repetir el include es explícito y
#      no depende de esa regla.
#   2. No se aplican a /api/: el backend ya envía las suyas con helmet (más
#      completas), y nginx las duplicaría.
#
# `always`: también en respuestas de error (404), no solo en las 200.

# El navegador no adivina el tipo de un fichero: un .png no se ejecuta como script
add_header X-Content-Type-Options "nosniff" always;
# Nadie puede incrustar la app en un iframe (clickjacking)
add_header X-Frame-Options "DENY" always;
# A otros sitios solo les llega el origen, nunca la ruta completa
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
